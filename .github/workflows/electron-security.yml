# Keeps Zirtola's Chromium patched without anyone having to merge anything.
# Every 3 hours: if Electron has a new patch release in the current major version (these carry Chromium
# security fixes), update to it, build, run the speed & stability benchmark, and only if all of that
# passes, commit to main and start a release, so installed copies get it through "Check for updates".
# Major versions (a new Chromium every ~8 weeks) are left for a person to test: an issue is opened so
# it isn't forgotten (Electron only patches its newest three majors).
name: Electron security updates

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: electron-security
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The job token isn't left in .git/config, where install scripts could read it.
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Update Electron within the current major version
        id: bump
        run: |
          current=$(node -p "require('electron/package.json').version")
          major=${current%%.*}
          npm install "electron@^$major" --no-audit --no-fund
          latest=$(node -p "require('electron/package.json').version")
          echo "current=$current latest=$latest"
          if [ "$current" = "$latest" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi

      # Every installed package must carry a valid npm registry signature (runs every time, so a broken
      # check shows up on the next run, not only when there's an update).
      - name: Verify package signatures
        run: npm audit signatures

      - name: Check the update is only Electron
        if: steps.bump.outputs.changed == 'true'
        run: |
          # Only package.json/package-lock.json may change, and in the lockfile only Electron and its own
          # direct dependencies (@electron/get etc.).
          changed=$(git diff --name-only)
          [ "$changed" = "$(printf 'package-lock.json\npackage.json')" ] || { echo "unexpected files changed: $changed"; exit 1; }
          node -e "
            const { execSync } = require('child_process')
            const before = JSON.parse(execSync('git show HEAD:package-lock.json', { maxBuffer: 1e8 })).packages
            const after = JSON.parse(require('fs').readFileSync('package-lock.json', 'utf8')).packages
            const keys = new Set([...Object.keys(before), ...Object.keys(after)])
            const own = new Set(['', 'node_modules/electron', ...Object.keys(after['node_modules/electron'].dependencies ?? {}).map((d) => 'node_modules/' + d)])
            const diff = [...keys].filter((k) => JSON.stringify(before[k]) !== JSON.stringify(after[k]) && !own.has(k) && !k.startsWith('node_modules/electron/'))
            if (diff.length) { console.error('lockfile changes beyond electron:', diff.join(', ')); process.exit(1) }
          "

      - name: Type-check and build
        if: steps.bump.outputs.changed == 'true'
        run: npm run typecheck && npm run build

      - name: Speed & stability benchmark
        if: steps.bump.outputs.changed == 'true'
        # Runner accounts can't use Chromium's sandbox helper; the benchmark only loads its own page.
        run: xvfb-run -a npx electron --no-sandbox scripts/bench

      - name: Security checks
        if: steps.bump.outputs.changed == 'true'
        run: xvfb-run -a npx electron --no-sandbox scripts/security-check

      - name: Commit to main and release
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Electron ${{ steps.bump.outputs.version }} (Chromium security update)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          # Pushes made with the workflow token don't trigger other workflows, so start the release directly.
          gh workflow run release.yml --ref main

      - name: Open an issue when a new Electron major version is out
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(node -p "require('electron/package.json').version")
          latest=$(npm view electron dist-tags.latest)
          if [ "${latest%%.*}" -gt "${current%%.*}" ]; then
            title="Electron ${latest%%.*} is out (Zirtola is on ${current%%.*})"
            if [ -z "$(gh issue list --state open --search "in:title \"$title\"" --json number -q '.[].number')" ]; then
              gh issue create --title "$title" --body "Electron $latest (a newer Chromium) is available. Zirtola is on $current. Electron only ships security fixes for its newest three major versions, so update, test (npm run bench) and release before ${current%%.*} falls out of support."
            fi
          fi
