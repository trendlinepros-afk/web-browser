name: Release

# Every push to main ships a new version, so "Check for updates" in the browser always sees the
# latest code. Version = <major>.<minor> from package.json + the workflow run number as patch.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'LICENSE', '.github/dependabot.yml']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Compute version
        run: echo "version=$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')").${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every release names the Electron it's built on: the browser compares that with its own and
          # treats a newer one as a security update (downloaded right away, restart asked for).
          lockver() { node -e "const l=JSON.parse(require('fs').readFileSync(0,'utf8'));console.log(l.packages['node_modules/electron'].version)"; }
          electron=$(lockver < package-lock.json)
          notes="Built on Electron $electron."
          prev=$(gh release view --json tagName -q .tagName --repo "$GITHUB_REPOSITORY" 2>/dev/null || true)
          if [ -n "$prev" ] && git fetch -q --depth=1 origin "refs/tags/$prev:refs/tags/$prev"; then
            before=$(git show "$prev:package-lock.json" | lockver || true)
            if [ -n "$before" ] && [ "$before" != "$electron" ]; then
              notes="**Security update:** Chromium security fixes (Electron $before → $electron). $notes"
            fi
          fi
          gh release create "v${{ steps.version.outputs.version }}" --draft --target "$GITHUB_SHA" \
            --title "v${{ steps.version.outputs.version }}" --notes "$notes" --generate-notes --repo "$GITHUB_REPOSITORY"

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Set version
        run: npm version "${{ needs.draft.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run typecheck
      - run: npm run build
      - name: Bundle ad/tracker filter lists
        run: npm run filters
      - name: Build installers and upload to the draft release
        run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No signing certificates yet (see docs/SPEC.md §7).
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release (makes it visible to "Check for updates")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v${{ needs.draft.outputs.version }}" --draft=false --latest --repo "$GITHUB_REPOSITORY"
