<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="overlay.css" />
    <title>Zirtola overlay</title>
  </head>
  <body>
    <div id="scrim"></div>
    <div id="menus"></div>
    <div id="prompt" class="prompt" role="alertdialog" aria-modal="true" hidden>
      <div class="prompt-icon"></div>
      <div class="prompt-text">
        <div class="prompt-title"></div>
        <div class="prompt-message"></div>
        <div class="prompt-detail"></div>
      </div>
      <div class="prompt-buttons"></div>
    </div>
    <aside id="settings" hidden aria-label="Settings">
      <div class="side">
        <div class="title"><span class="mark"></span>Settings</div>
        <nav id="settings-nav" aria-label="Settings sections"></nav>
      </div>
      <div class="main">
        <header>
          <div>
            <h1 id="settings-title"></h1>
            <p id="settings-subtitle"></p>
          </div>
          <button id="settings-close" class="icon" aria-label="Close settings"></button>
        </header>
        <div id="settings-body"></div>
      </div>
    </aside>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
