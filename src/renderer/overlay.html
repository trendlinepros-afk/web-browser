<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="overlay.css" />
    <title>Zirtola overlay</title>
  </head>
  <body>
    <div id="scrim"></div>
    <div id="menus"></div>
    <div id="prompt" class="prompt" role="alertdialog" aria-modal="true" hidden>
      <div class="prompt-icon"></div>
      <div class="prompt-text">
        <div class="prompt-title"></div>
        <div class="prompt-message"></div>
        <div class="prompt-detail"></div>
      </div>
      <div class="prompt-buttons"></div>
    </div>
    <aside id="settings" hidden aria-label="Settings">
      <div class="side">
        <div class="title"><span class="mark"></span>Settings</div>
        <nav id="settings-nav" aria-label="Settings sections"></nav>
      </div>
      <div class="main">
        <header>
          <div class="heading">
            <h1 id="settings-title"></h1>
            <p id="settings-subtitle"></p>
          </div>
          <label id="settings-search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>
            <input id="settings-query" type="search" placeholder="Search settings" spellcheck="false" aria-label="Search settings" />
          </label>
          <button id="settings-close" class="icon" aria-label="Close settings"></button>
        </header>
        <div id="settings-body"></div>
      </div>
    </aside>
    <section id="chat" hidden aria-label="Chat with Claude">
      <header>
        <span class="mark" aria-hidden="true"></span>
        <div class="title">Claude</div>
        <span class="where">in Zirtola</span>
        <button id="chat-new" class="icon" type="button" title="New chat" aria-label="New chat"></button>
        <button id="chat-close" class="icon" type="button" title="Close (Esc)" aria-label="Close chat"></button>
      </header>
      <div id="chat-log" aria-live="polite"></div>
      <form id="chat-form" autocomplete="off">
        <textarea id="chat-input" rows="1" placeholder="Ask Claude to do something in this tab…" spellcheck="true"></textarea>
        <button id="chat-send" type="submit" aria-label="Send"></button>
      </form>
    </section>
    <section id="worklog" hidden aria-label="My time">
      <header>
        <span class="mark" aria-hidden="true"></span>
        <div class="title">My time</div>
        <div class="day-nav">
          <button id="wl-prev" class="icon" type="button" title="Previous day" aria-label="Previous day"></button>
          <span id="wl-day"></span>
          <button id="wl-next" class="icon" type="button" title="Next day" aria-label="Next day"></button>
        </div>
        <span id="wl-total" class="where"></span>
        <button id="wl-settings" class="icon" type="button" title="Time tracking settings" aria-label="Time tracking settings"></button>
        <button id="wl-close" class="icon" type="button" title="Close (Esc)" aria-label="Close"></button>
      </header>
      <div id="wl-off" class="wl-banner" hidden>
        <span>Time tracking is off. Turn it on and Zirtola notes how long you spend on each ConnectWise ticket.</span>
        <button id="wl-setup" class="btn primary" type="button">Set up</button>
      </div>
      <div id="wl-list"></div>
      <footer>
        <button id="wl-add" class="btn" type="button">Add entry</button>
        <span class="spacer"></span>
        <button id="wl-draft" class="btn" type="button" title="Claude reads each ticket and suggests notes for entries that have none. You review them before approving.">Draft notes with Claude</button>
        <button id="wl-enter" class="btn primary" type="button">Enter approved in ConnectWise</button>
      </footer>
    </section>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
