<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: http: https: crx:; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="styles.css" />
    <title>Zirtola</title>
  </head>
  <body>
    <div id="tabstrip">
      <div id="mark" aria-hidden="true"></div>
      <div id="tabs" role="tablist"></div>
      <button id="new-tab" class="icon-btn" title="New tab (Ctrl+T)" aria-label="New tab"></button>
      <button id="chromium-tag" type="button"></button>
      <span id="app-version"></span>
    </div>
    <div id="toolbar">
      <button id="back" class="icon-btn" title="Back (Alt+Left)" aria-label="Back"></button>
      <button id="forward" class="icon-btn" title="Forward (Alt+Right)" aria-label="Forward"></button>
      <button id="reload" class="icon-btn" title="Reload (Ctrl+R)" aria-label="Reload"></button>
      <button id="home" class="icon-btn" title="Home (Alt+Home)" aria-label="Home"></button>
      <form id="address-form" autocomplete="off">
        <span id="site-icon" aria-hidden="true"></span>
        <span id="incognito-badge" hidden>Private</span>
        <div id="address-wrap">
          <input id="address" type="text" spellcheck="false" placeholder="Search the web or type an address" aria-label="Address and search bar" />
          <div id="address-display" aria-hidden="true"></div>
        </div>
        <div id="toast" role="status" aria-live="polite" hidden><span class="toast-text"></span><button type="button" class="toast-btn" hidden></button></div>
        <button id="star" type="button" class="star" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"></button>
      </form>
      <button id="shield" class="icon-btn" title="Ad &amp; tracker blocking" aria-label="Ad and tracker blocking"></button>
      <div id="extensions"></div>
      <button id="mcp-badge" type="button" hidden title="Chat with Claude (Ctrl+Shift+K)">Claude</button>
      <button id="menu" class="icon-btn" title="Zirtola menu" aria-label="Zirtola menu"></button>
    </div>
    <div id="bookmarks-bar" hidden>
      <div id="bm-items" role="toolbar" aria-label="Bookmarks"></div>
      <span id="bm-empty" hidden>
        For quick access, put your bookmarks here.
        <button id="bm-import" type="button">Import from Firefox…</button>
      </span>
      <button id="bm-overflow" class="bm" type="button" hidden title="More bookmarks" aria-label="More bookmarks"></button>
      <button id="bm-other" class="bm" type="button" hidden><span class="title">Other bookmarks</span></button>
    </div>
    <script type="module" src="ui.js"></script>
  </body>
</html>
